<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VineTrack Beta Feedback Admin</title><link rel="stylesheet" href="landing.css"><style>.admin{max-width:1000px;margin:50px auto}.feedback-item{background:#fff;border:1px solid #dfe5f1;border-radius:14px;padding:18px;margin:12px 0}.feedback-item pre{white-space:pre-wrap;font:inherit;color:#4b5563}.admin-actions{display:flex;gap:10px;align-items:end}.admin-actions label{flex:1}</style></head><body><main class="wrap admin"><span class="eyebrow">VineTrack admin</span><h1>Beta feedback</h1><p class="sub">Enter the server admin key configured as <code>VINETRACK_ADMIN_KEY</code>. The key is sent only in the request header and is not stored by this page.</p><div class="admin-actions"><label>Admin key<input id="key" type="password"></label><button id="load" class="primary">Load feedback</button></div><p id="status" class="status"></p><div id="items"></div></main><script>
const $=id=>document.getElementById(id);$('load').onclick=async()=>{ $('status').textContent='Loading…';$('items').innerHTML='';try{const r=await fetch('/api/feedback-export',{headers:{'X-Admin-Key':$('key').value}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load feedback');$('status').textContent=`${d.count} feedback response${d.count===1?'':'s'}`;d.feedback.slice().reverse().forEach(x=>{const a=document.createElement('article');a.className='feedback-item';const h=document.createElement('strong');h.textContent=(x.app||'VineTrack feedback')+' · '+(x.server_received_at||x.at||x.createdAt||'');const pre=document.createElement('pre');pre.textContent=JSON.stringify(x,null,2);a.append(h,pre);$('items').appendChild(a);});}catch(e){$('status').textContent=e.message;}};
</script></body></html>
